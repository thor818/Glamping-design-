  <!-- ================= ELEVATION (1 m = 100 px) ================= -->
  <text x="40" y="640" font-size="17" font-weight="bold" fill="#222">Vista frontale del bar (dalla sala)</text>
  <text x="40" y="660" font-size="12" fill="#666">Parete magazzino/cantina come parete grafica: porte rasomuro mimetizzate, insegna luminosa, schermi menu sopra la cassa.</text>
  <g transform="translate(225,680) scale(100)" font-family="Helvetica, Arial, sans-serif">
    <!-- wall -->
    <rect x="0" y="0" width="6.3" height="3.2" fill="#22302e"/>
    <!-- doors (flush, hidden) -->
    <g fill="none" stroke="#3c4f4c" stroke-width="0.015">
      <rect x="2.5" y="1.1" width="0.8" height="2.1"/>
      <rect x="5.1" y="1.1" width="0.8" height="2.1"/>
    </g>
    <!-- lettering -->
    <g font-weight="bold" fill="#ffd166">
      <text x="1.05" y="0.62" text-anchor="middle" font-size="0.29">GOOD FOOD</text>
      <text x="1.05" y="1.05" text-anchor="middle" font-size="0.29" fill="#f4a261">GOOD TIME</text>
      <text x="5.4" y="0.62" text-anchor="middle" font-size="0.24">GOOD PEOPLE</text>
      <text x="5.4" y="1.05" text-anchor="middle" font-size="0.24" fill="#f4a261">GOOD LIFE</text>
    </g>
    <line x1="0.2" y1="1.18" x2="1.9" y2="1.18" stroke="#ffd166" stroke-width="0.02"/>
    <line x1="4.65" y1="1.18" x2="6.15" y2="1.18" stroke="#ffd166" stroke-width="0.02"/>
    <!-- menu screens -->
    <g>
      <rect x="2.75" y="0.35" width="0.5" height="0.8" fill="#111" stroke="#666" stroke-width="0.015"/>
      <rect x="3.3" y="0.35" width="0.5" height="0.8" fill="#111" stroke="#666" stroke-width="0.015"/>
      <rect x="3.85" y="0.35" width="0.5" height="0.8" fill="#111" stroke="#666" stroke-width="0.015"/>
      <g font-size="0.09" fill="#ffd166" text-anchor="middle" font-weight="bold">
        <text x="3.0" y="0.55">PIZZE</text><text x="3.55" y="0.55">PIATTI</text><text x="4.1" y="0.55">BIRRE</text>
      </g>
      <g stroke="#555" stroke-width="0.012">
        <line x1="2.82" y1="0.68" x2="3.18" y2="0.68"/><line x1="2.82" y1="0.8" x2="3.18" y2="0.8"/><line x1="2.82" y1="0.92" x2="3.18" y2="0.92"/>
        <line x1="3.37" y1="0.68" x2="3.73" y2="0.68"/><line x1="3.37" y1="0.8" x2="3.73" y2="0.8"/><line x1="3.37" y1="0.92" x2="3.73" y2="0.92"/>
        <line x1="3.92" y1="0.68" x2="4.28" y2="0.68"/><line x1="3.92" y1="0.8" x2="4.28" y2="0.8"/><line x1="3.92" y1="0.92" x2="4.28" y2="0.92"/>
      </g>
    </g>
    <!-- wood band behind counter -->
    <rect x="0.6" y="1.35" width="5.7" height="0.75" fill="url(#slat)" opacity="0.55"/>
    <!-- heat lamps over pick-up + pendants -->
    <g stroke="#888" stroke-width="0.01">
      <line x1="1.0" y1="0" x2="1.0" y2="1.45"/><line x1="1.6" y1="0" x2="1.6" y2="1.45"/>
      <line x1="4.9" y1="0" x2="4.9" y2="1.4"/><line x1="5.6" y1="0" x2="5.6" y2="1.4"/>
    </g>
    <g fill="#ffb703"><path d="M0.88,1.45 h0.24 l0.05,0.12 h-0.34z"/><path d="M1.48,1.45 h0.24 l0.05,0.12 h-0.34z"/></g>
    <g fill="#f1faee"><circle cx="4.9" cy="1.46" r="0.07"/><circle cx="5.6" cy="1.46" r="0.07"/></g>
    <!-- beer taps -->
    <g fill="#c9c9c9">
      <rect x="4.75" y="1.82" width="0.04" height="0.28"/><rect x="5.0" y="1.82" width="0.04" height="0.28"/>
      <rect x="5.25" y="1.82" width="0.04" height="0.28"/><rect x="5.5" y="1.82" width="0.04" height="0.28"/>
      <rect x="4.7" y="1.78" width="0.9" height="0.05" fill="#999"/>
    </g>
    <!-- pizza display -->
