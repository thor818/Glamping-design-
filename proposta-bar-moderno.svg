      <line x1="5.2" y1="1.1" x2="6.8" y2="1.1"/><line x1="5.2" y1="1.45" x2="6.8" y2="1.45"/>
      <line x1="5.2" y1="1.8" x2="6.8" y2="1.8"/><line x1="5.2" y1="2.15" x2="6.8" y2="2.15"/>
    </g>
    <text x="2.22" y="2.3" text-anchor="middle" font-weight="bold" fill="#444">CUCINA</text>
    <text x="5.8" y="2.8" text-anchor="middle" fill="#666" font-size="0.22">scala</text>
    <text x="8.55" y="1.3" text-anchor="middle" fill="#666" font-size="0.22">forno</text>
    <text x="8.55" y="1.6" text-anchor="middle" fill="#666" font-size="0.22">a legna</text>
    <text x="14.1" y="0.8" text-anchor="middle" fill="#444">MAGAZZINO</text>
    <text x="17.27" y="0.8" text-anchor="middle" fill="#444">CANTINA</text>
    <text x="1.2" y="7.6" text-anchor="middle" fill="#888" font-size="0.22">tettoia</text>

    <!-- kegs in cantina -->
    <g fill="#d4a017" stroke="#8a6a00" stroke-width="0.02">
      <circle cx="16.4" cy="1.6" r="0.2"/><circle cx="16.85" cy="1.6" r="0.2"/><circle cx="16.4" cy="1.15" r="0.2"/><circle cx="16.85" cy="1.15" r="0.2"/>
    </g>
    <text x="16.62" y="2.15" text-anchor="middle" fill="#8a6a00" font-size="0.16">fusti + spillatore</text>

    <!-- pizza station in alcove -->
    <rect x="9.95" y="0.06" width="2.4" height="0.7" fill="#e76f51" stroke="#9c3d26" stroke-width="0.03"/>
    <text x="11.15" y="0.47" text-anchor="middle" fill="#fff" font-size="0.2" font-weight="bold">BANCO PIZZA</text>
    <text x="11.15" y="1.15" text-anchor="middle" fill="#9c3d26" font-size="0.17">pizzaiolo a vista</text>
    <text x="11.15" y="1.38" text-anchor="middle" fill="#9c3d26" font-size="0.17">accanto al forno</text>

    <!-- WC block -->
