<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1250" width="1080" height="1250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d55"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e07a1f"/></marker>
    <pattern id="slat" width="0.08" height="1" patternUnits="userSpaceOnUse">
      <rect width="0.08" height="1" fill="#b07d4f"/><rect width="0.012" height="1" fill="#8a5d36"/>
    </pattern>
  </defs>
  <rect width="1080" height="1250" fill="#ffffff"/>
  <text x="40" y="34" font-size="22" font-weight="bold" fill="#222">Bar moderno “Good Food” – cassa al centro, ritiro e birre ai lati</text>
  <text x="40" y="56" font-size="13" fill="#666">Pianta schematica dallo schizzo (≈ 1:100, misure da verificare). Nessun muro demolito.</text>

  <!-- ================= PLAN (1 m = 50 px) ================= -->
  <g transform="translate(40,80) scale(50)" font-size="0.26">
