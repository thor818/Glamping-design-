    <text x="5" y="7.6" text-anchor="middle" fill="#555">WC / servizi</text>
    <text x="5" y="7.95" text-anchor="middle" fill="#888" font-size="0.22">(invariati)</text>

    <!-- walls -->
    <g stroke="#222" stroke-width="0.12" fill="none" stroke-linecap="square">
      <line x1="0" y1="0" x2="18.7" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="10.5"/>
      <line x1="18.7" y1="0" x2="18.7" y2="5.6"/>
      <line x1="18.7" y1="6.5" x2="18.7" y2="10.5"/>
      <line x1="4.45" y1="0" x2="4.45" y2="3.5"/>
      <line x1="4.45" y1="4.3" x2="4.45" y2="4.75"/>
      <line x1="0" y1="4.75" x2="4.45" y2="4.75"/>
      <line x1="4.45" y1="3.3" x2="7.2" y2="3.3"/>
