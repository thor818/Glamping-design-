      <line x1="9.9" y1="0" x2="9.9" y2="2.67"/>
      <line x1="12.4" y1="0" x2="12.4" y2="2.38"/>
      <line x1="15.85" y1="0" x2="15.85" y2="2.38"/>
      <line x1="12.4" y1="2.38" x2="14.9" y2="2.38"/>
      <line x1="15.7" y1="2.38" x2="17.5" y2="2.38"/>
      <line x1="18.3" y1="2.38" x2="18.7" y2="2.38"/>
      <line x1="12.4" y1="2.38" x2="11.8" y2="3.56"/>
    </g>
    <g stroke="#555" stroke-width="0.03" fill="none">
      <path d="M4.45,3.5 L3.65,3.5 A0.8,0.8 0 0 0 4.45,4.3"/>
      <path d="M14.9,2.38 L14.9,1.58 A0.8,0.8 0 0 1 15.7,2.38"/>
      <path d="M17.5,2.38 L17.5,1.58 A0.8,0.8 0 0 1 18.3,2.38"/>
    </g>
    <text x="18.85" y="6.15" fill="#666" font-size="0.2">→ scala /</text>
    <text x="18.85" y="6.4" fill="#666" font-size="0.2">dance</text>

    <!-- graphic wall -->
    <line x1="12.5" y1="2.47" x2="18.62" y2="2.47" stroke="#e76f51" stroke-width="0.07"/>

    <!-- old bar removed -->
    <rect x="7.8" y="4.9" width="3.4" height="1.7" rx="0.35" fill="#e63946" fill-opacity="0.07" stroke="#e63946" stroke-width="0.05" stroke-dasharray="0.15 0.1"/>
    <line x1="7.9" y1="5" x2="11.1" y2="6.5" stroke="#e63946" stroke-width="0.04"/>
    <line x1="7.9" y1="6.5" x2="11.1" y2="5" stroke="#e63946" stroke-width="0.04"/>
    <text x="9.5" y="7.0" text-anchor="middle" fill="#e63946" font-weight="bold" font-size="0.22">BAR ATTUALE – DA TOGLIERE</text>
    <rect x="7.6" y="7.4" width="0.6" height="2.0" fill="#8ecae6" stroke="#457b9d" stroke-width="0.04"/>
    <text x="8.4" y="8.25" fill="#1d3557" font-size="0.22">rientro vassoi</text>
    <text x="8.4" y="8.55" fill="#1d3557" font-size="0.22">acqua · posate · salse</text>

    <!-- aisle -->
    <rect x="12.4" y="2.52" width="6.3" height="0.76" fill="#fde7cf"/>

    <!-- counter -->
    <rect x="13.0" y="3.28" width="1.6" height="0.65" fill="#f4a259"/>
    <rect x="14.6" y="3.28" width="1.0" height="0.65" fill="#f6bd60"/>
    <rect x="15.6" y="3.28" width="1.2" height="0.65" fill="#2a9d8f"/>
    <rect x="16.8" y="3.28" width="1.9" height="0.65" fill="#e9c46a"/>
    <rect x="13.0" y="3.28" width="5.7" height="0.65" fill="none" stroke="#222" stroke-width="0.05"/>
    <g fill="#8a6a00"><circle cx="17.2" cy="3.45" r="0.06"/><circle cx="17.45" cy="3.45" r="0.06"/><circle cx="17.7" cy="3.45" r="0.06"/><circle cx="17.95" cy="3.45" r="0.06"/></g>
    <g font-size="0.19" text-anchor="middle" fill="#222" font-weight="bold">
      <text x="13.8" y="3.66">RITIRO</text>
      <text x="15.1" y="3.58" font-size="0.15">vetrina</text>
      <text x="15.1" y="3.78" font-size="0.15">pizze</text>
      <text x="16.2" y="3.67" fill="#fff">CASSA</text>
      <text x="17.75" y="3.78" font-size="0.17">BIRRE spina</text>
    </g>
    <line x1="17.35" y1="2.62" x2="17.35" y2="3.35" stroke="#8a6a00" stroke-width="0.03" stroke-dasharray="0.06 0.05"/>

    <!-- pillar -->
    <rect x="14.48" y="4.88" width="0.35" height="0.35" fill="#222"/>
    <text x="14.65" y="5.5" text-anchor="middle" fill="#444" font-size="0.17">pilastro = totem menu</text>

    <!-- staff flow -->
    <path d="M4.6,3.95 H11.6 L12.3,2.9 H13.6" fill="none" stroke="#e07a1f" stroke-width="0.07" stroke-dasharray="0.25 0.15" marker-end="url(#o)"/>
    <path d="M11.9,1.5 L12.45,2.85" fill="none" stroke="#e07a1f" stroke-width="0.05" stroke-dasharray="0.2 0.12"/>
    <text x="8" y="3.75" text-anchor="middle" fill="#e07a1f" font-size="0.2">percorso cucina → ritiro</text>
    <text x="15.9" y="3.15" text-anchor="middle" fill="#b5651d" font-size="0.15">barista: cassa + spina (1 persona)</text>

    <!-- customer flow -->
    <path d="M16.2,9.6 V4.15" fill="none" stroke="#2a9d55" stroke-width="0.08" marker-end="url(#g)"/>
    <path d="M12.2,7.6 L13.6,4.25" fill="none" stroke="#2a9d55" stroke-width="0.08" stroke-dasharray="0.2 0.1" marker-end="url(#g)"/>
    <g fill="#2a9d55" font-size="0.2">
