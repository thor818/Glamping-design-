      <text x="16.5" y="6.1">ordina, paga,</text><text x="16.5" y="6.35">prende la birra</text><text x="16.5" y="6.6">+ cicalino</text>
      <circle cx="12.75" cy="6.3" r="0.22"/><text x="12.75" y="6.37" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
      <text x="11.95" y="7.95" text-anchor="middle">al tavolo, suona →</text>
      <text x="11.95" y="8.2" text-anchor="middle">ritira il piatto</text>
