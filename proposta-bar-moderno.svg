    <rect x="0" y="0" width="4.45" height="4.75" fill="#ececec"/>
    <rect x="4.45" y="0" width="2.75" height="3.3" fill="#ececec"/>
    <rect x="7.2" y="0" width="2.7" height="2.67" fill="#ececec"/>
    <rect x="12.4" y="0" width="3.45" height="2.38" fill="#ececec"/>
    <rect x="15.85" y="0" width="2.85" height="2.38" fill="#ececec"/>
    <rect x="0" y="4.75" width="2.4" height="5.75" fill="#f1efe9"/>
    <g stroke="#999" stroke-width="0.03">
