    <!-- counter front -->
    <rect x="0.6" y="2.1" width="5.7" height="1.1" fill="url(#slat)"/>
    <rect x="0.6" y="2.05" width="5.7" height="0.07" fill="#2b2b2b"/>
    <rect x="3.2" y="2.12" width="1.2" height="1.08" fill="#2a9d8f" opacity="0.85"/>
    <g font-size="0.13" fill="#fff" font-weight="bold" text-anchor="middle">
      <text x="1.4" y="2.45">RITIRO</text>
      <text x="3.8" y="2.45">CASSA</text>
      <text x="5.35" y="2.45">BIRRE</text>
    </g>
    <!-- pillar in front -->
    <rect x="2.08" y="0" width="0.35" height="3.2" fill="#5b5b5b" opacity="0.55"/>
    <text x="2.255" y="1.9" font-size="0.1" fill="#fff" text-anchor="middle" transform="rotate(-90 2.255 1.9)">PILASTRO · TOTEM MENU</text>
    <!-- floor -->
    <line x1="-0.2" y1="3.2" x2="6.5" y2="3.2" stroke="#222" stroke-width="0.03"/>
    <g font-size="0.1" fill="#666">
      <text x="-0.15" y="2.12" text-anchor="end">h 1,10</text>
      <text x="-0.15" y="0.1" text-anchor="end">h ≈ 3,20</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#333" transform="translate(40,1035)">
    <text x="0" y="0" font-weight="bold" font-size="15">Perché così</text>
    <text x="0" y="24">• Cassa al centro: un solo barista fa cassa e spina, e in due passi aiuta anche al ritiro. La fila va dritta verso la sala, il pilastro non dà fastidio.</text>
    <text x="0" y="46">• Ritiro a sinistra, vicino all'ingresso della cucina e al forno: cucina e pizzaiolo fanno 1–2 metri per appoggiare i piatti.</text>
    <text x="0" y="68">• Birre a destra, attaccate alla cantina: fusti in cantina e linee corte fino alle spine (solo un piccolo foro, nessun muro rotto).</text>
    <text x="0" y="90">• Fast food “ordina e paga → cicalino → ritira”: niente fila lunga col vassoio lungo il bancone, più veloce nelle ore di punta.</text>
    <text x="0" y="112">• Parete dietro tutta grafica: GOOD FOOD · GOOD TIME · GOOD PEOPLE · GOOD LIFE, con porte rasomuro e luce calda.</text>
    <text x="0" y="140" fill="#d00">⚠ Da verificare in loco: dove esce la bocca del forno, altezza soffitto, distanza muro–pilastro, passaggio linee birra cantina → bancone.</text>
  </g>
</svg>
